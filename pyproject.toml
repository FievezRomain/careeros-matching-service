[project]
name = "careeros-matching-service"
version = "0.1.0"
description = "CareerOS deterministic matching boundary"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi>=0.165,<0.166", "pydantic>=2.12,<3", "pydantic-settings>=2.16,<3", "pyjwt[crypto]>=2.10,<3", "uvicorn>=0.54,<0.55"]

[dependency-groups]
dev = ["bandit>=1.9,<2", "httpx2>=2.16,<3", "mypy>=1.19,<2", "pip-audit>=2.10,<3", "pytest>=9.2,<10", "ruff>=0.14,<0.15"]

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_matching"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
cache_dir = ".pytest_cache/mypy"

[tool.ruff]
target-version = "py314"
line-length = 100
cache-dir = ".pytest_cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.careeros.quality]
package = "src/careeros_matching"
persistence = false
domain = "src/careeros_matching/domain"
application = "src/careeros_matching/application"
ports = "src/careeros_matching/application"
adapters = "src/careeros_matching/adapters"
composition_root = "src/careeros_matching/adapters/http.py"

[tool.careeros.quality.commands]
format = "uv run ruff format --check ."
lint = "uv run ruff check ."
type = "uv run mypy src tests"
test = "uv run pytest"
secret = "gitleaks detect --redact --no-banner"
security = "uv run pip-audit && uv run bandit -q -r src"

[tool.careeros.quality.logging]
structured = true
correlation = true
redaction = true

[tool.careeros.quality.evidence]
unit = "tests/test_scoring.py"
integration = "tests/test_scoring.py"
contract = "tests/test_scoring.py"
health = "tests/test_scoring.py"
logging = "tests/test_scoring.py"
security = "tests/test_scoring.py"
